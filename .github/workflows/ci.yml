name: EPSE CI

on:
  push:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          find . \( \
            -name "*.c" -o \
            -name "*.h" -o \
            -name "*.cpp" -o \
            -name "*.hpp" \
          \) -exec clang-format --dry-run --Werror -style=LLVM {} \;

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake

      - name: Download LibTorch
        run: |
          wget https://download.pytorch.org/libtorch/cpu/libtorch-shared-with-deps-2.7.1%2Bcpu.zip
          unzip libtorch-shared-with-deps-2.7.1+cpu.zip

      - name: Configure
        run: |
          mkdir build
          cd build
          cmake \
            -DCMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/libtorch \
            ..

      - name: Build
        run: |
          cd build
          cmake --build . --config Release
