name: EPSE CI

on:
  push:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          find . \( \
            -name "*.c" -o \
            -name "*.h" -o \
            -name "*.cpp" -o \
            -name "*.hpp" \
          \) -exec clang-format --dry-run --Werror -style=LLVM {} \;

  syntax-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++

      - name: Check C files
        run: |
          find . -name "*.c" ! -path "./tests/*" | while read file
          do
            echo "Checking $file"
            gcc -Wall -Wextra -Werror -fsyntax-only "$file"
          done

  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5

      - name: Install HTML validator
        run: |
          pip install html5validator

      - name: Validate HTML documentation
        run: |
          html5validator --root .

  ctest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            wget \
            unzip

      - name: Download LibTorch
        run: |
          wget -O libtorch.zip \
            https://download.pytorch.org/libtorch/cpu/libtorch-cxx11-abi-shared-with-deps-2.7.1%2Bcpu.zip

          unzip -q libtorch.zip

      - name: Configure
        run: |
          mkdir build
          cd build

          cmake .. \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/libtorch"

      - name: Build
        run: |
          cd build
          make -j$(nproc)

      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure
