name: EPSE CI

on:
  push:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          find . \( \
            -name "*.c" -o \
            -name "*.h" -o \
            -name "*.cpp" -o \
            -name "*.hpp" \
          \) -exec clang-format --dry-run --Werror -style=LLVM {} \;

  syntax-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++

      - name: Check C syntax
        run: |
          find . -name "*.c" | while read file
          do
            echo "Checking $file"
            gcc -Wall -Wextra -Werror -fsyntax-only "$file"
          done

  cmake-configure:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake

      - name: Verify CMakeLists.txt parses
        run: |
          mkdir build
          cd build
          cmake -DEPSE_ENABLE_EMBEDDER=OFF ..
          
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5

      - name: Install HTML validator
        run: |
          pip install html5validator

      - name: Validate HTML documentation
        run: |
          html5validator --root .
